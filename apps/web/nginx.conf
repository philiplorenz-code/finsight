# The API name must be re-resolved after an API container is replaced
# (for example when enabling MCP), rather than retaining its former IP forever.
# Template: FINSIGHT_NGINX_RESOLVER and FINSIGHT_API_UPSTREAM are filled in at container start
# (defaults: Docker's embedded DNS and the compose service "api"; Kubernetes sets its own).
upstream finsight_api {
    zone finsight_api 64k;
    resolver ${FINSIGHT_NGINX_RESOLVER} valid=5s ipv6=off;
    server ${FINSIGHT_API_UPSTREAM} resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # SPA paths and query strings can contain private transaction filters.
    access_log off;
    # Upstream errors can otherwise echo private explorer query strings.
    error_log /dev/stderr crit;
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    # MCP is not the SPA consent page (/mcp/authorize). Keep protocol paths exact.
    location = /mcp {
        proxy_pass http://finsight_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
    location = /mcp/ {
        proxy_pass http://finsight_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
    location ^~ /oauth/ {
        proxy_pass http://finsight_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never pass a user-supplied IP claim. Backend must explicitly trust this
        # immediate proxy's network before using the overwritten header.
        proxy_set_header X-FinSight-Client-IP $remote_addr;
        proxy_http_version 1.1;
    }
    location ^~ /.well-known/ {
        proxy_pass http://finsight_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/ {
        access_log off;
        proxy_pass http://finsight_api;
        proxy_http_version 1.1;
        # Preserve the browser's authority, including a non-default public port.
        # Origin validation remains enforced by the API; do not trust client XFH.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
