[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23.1",
  "python-multipart>=0.0.33", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1",
  "pydantic-settings>=2.6,<3", "langgraph>=0.2,<2", "litellm>=1.55,<2",
  "httpx>=0.27,<1", "pytest>=8,<10", "mcp>=1.26,<2"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["concurrent_db: use a file-backed sqlite database so parallel requests do not share one connection"]
