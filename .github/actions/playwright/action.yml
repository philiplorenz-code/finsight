name: Install Playwright Chromium
description: Cached browser download plus system dependencies, retried when apt mirrors are unreachable.
inputs:
  prefix:
    description: Directory that holds the web app package
    default: apps/web
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
    - shell: bash
      run: |
        for attempt in 1 2 3 4; do
          if npx --prefix "${{ inputs.prefix }}" playwright install --with-deps chromium; then exit 0; fi
          echo "attempt $attempt failed; refreshing apt lists and retrying"
          sudo apt-get update || true
          sleep $((attempt * 20))
        done
        exit 1
