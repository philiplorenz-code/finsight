# Paperless-ngx next to FinSight, local only (127.0.0.1:8010). Separate compose project, separate volumes.
#   docker compose -p finsight-paperless --env-file ~/Paperless/.env -f infrastructure/paperless/docker-compose.yml up -d
# See docs/integrations/paperless.md.
name: finsight-paperless
services:
  broker:
    image: docker.io/library/redis:7.4-alpine
    restart: unless-stopped
    volumes: [redisdata:/data]
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U paperless -d paperless"]
      interval: 10s
      retries: 10
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_started}
    ports: ["127.0.0.1:8010:8000"]
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ${PAPERLESS_CONSUME_DIR:-~/Paperless/consume}:/usr/src/paperless/consume
      - ${PAPERLESS_EXPORT_DIR:-~/Paperless/export}:/usr/src/paperless/export
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: http://127.0.0.1:8010
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8010,http://localhost:8010
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_OCR_LANGUAGES: deu
      PAPERLESS_FILENAME_FORMAT: "{{ created_year }}/{{ correspondent }}/{{ title }}"
      USERMAP_UID: ${PAPERLESS_UID:-1000}
      USERMAP_GID: ${PAPERLESS_GID:-1000}
volumes:
  data:
  media:
  pgdata:
  redisdata:
